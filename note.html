<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'none'; form-action 'none'; base-uri 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#EDF4F0" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0B1E19" media="(prefers-color-scheme: dark)">
  <title>Your note</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap">
  <link rel="stylesheet" href="src/styles.css">
  <script type="module" src="src/note-page.js"></script>
</head>
<body>
  <main class="page">
    <a class="back-link" href="index.html">Write another note</a>

    <article id="card" class="card" aria-labelledby="card-greeting">
      <div class="stamp">
        <span id="stamp-label" class="stamp-label"></span>
        <span id="stamp-date" class="stamp-date"></span>
      </div>
      <h1 id="card-greeting" class="greeting"></h1>
      <p id="card-wish" class="wish" aria-live="polite"></p>
      <p id="card-position" class="position-line"></p>
      <p id="card-signoff" class="signoff"></p>
    </article>

    <div class="actions">
      <button type="button" id="another" class="button button-quiet">Another wish</button>
      <button type="button" id="copy" class="button button-quiet">Copy wish</button>
      <button type="button" id="save" class="button button-quiet">Save my note</button>
    </div>

    <figure id="save-preview" class="save-preview" hidden>
      <img id="save-preview-image" alt="Your note as an image">
      <figcaption>Press and hold the image to save it.</figcaption>
    </figure>

    <section id="connect" class="connect" aria-labelledby="connect-heading" hidden>
      <h2 id="connect-heading"></h2>
      <p id="connect-text"></p>
      <a id="whatsapp" class="button button-link" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path fill="currentColor" d="M12 3C6.9 3 3 6.6 3 11.1c0 2.3 1 4.3 2.7 5.8L5 21l4.3-2.1c.9.2 1.8.3 2.7.3 5.1 0 9-3.6 9-8.1S17.1 3 12 3Zm0 14.4c-.8 0-1.6-.1-2.4-.3l-.5-.1-2 1 .4-1.9-.4-.4C5.8 14.5 5 12.9 5 11.1 5 7.8 8.1 5 12 5s7 2.8 7 6.1-3.1 6.3-7 6.3Z"/>
        </svg>
        <span id="connect-label"></span>
      </a>
    </section>
  </main>
  <noscript><p class="noscript">This note needs JavaScript to write itself. Please turn it on and reload.</p></noscript>
</body>
</html>
